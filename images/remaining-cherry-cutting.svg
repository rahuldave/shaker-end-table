<text x="715" y="243" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263d38" text-anchor="start">Width total: 8, including four kerfs,</text>
<text x="715" y="268" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263d38" text-anchor="start">1/4 edge reserve each side + 1/2 spare.</text>
<text x="34" y="298" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Rail strip: 1 x 31 -&gt; upper rail R1 + lower rail R2, each 1 x 15; two kerfs + 3/4 remainder.</text>
<text x="34" y="325" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Each guide strip: 1 1/4 x 31 -&gt; two 1 1/4 x 14 guides; two kerfs + 2 3/4 remainder.</text>
<text x="34" y="352" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Spacer strip: 3 x 31 -&gt; 3 x 16 parent for BOTH thin spacers; kerf + 14 7/8 reserve.</text>
