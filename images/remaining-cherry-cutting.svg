<text x="34" y="183" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Rear apron A3: 5 1/2 x 14.   Drawer front DF: 4 x 14.   Remaining 10 5/8 x 8: TEST-C / spare material.</text>
<text x="34" y="215" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263d38" text-anchor="start">Across the 8-in-wide, 31-in-long parent, reserve these long strips:</text>
