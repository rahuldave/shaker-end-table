<text x="34" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263d38" text-anchor="start">Length 96 in  |  board width 8 in  |  grain runs left to right  &gt;</text>
<text x="34" y="186" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Top strips T1-T3: rough 6 3/4 x 21 each; joint to about 6 1/2 wide.</text>
<text x="34" y="216" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Glue-up: about 19 1/2 x 21; finish 3/4 x 18 x 18.</text>
<text x="34" y="246" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Side aprons A1-A2: rough 5 1/2 x 14 each. Final remainder: 2 3/8.</text>
