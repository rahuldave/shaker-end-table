<text x="34" y="61" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Example 4/4 cherry; assumed actual 1 x 8 x 96 in. All cuts below reserve 1/8-in kerfs.</text>
