<text x="35" y="170" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Complete solid top</text>
<text x="35" y="197" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">3/4 x 18 x 18 in</text>
<text x="35" y="224" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Center cut away here</text>
<line x1="273" y1="177" x2="430" y2="228.0" stroke="#668272" stroke-width="1.8"/>
<text x="930" y="192" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Rear apron (A3)</text>
<text x="930" y="219" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Same size as front</text>
<line x1="920" y1="199" x2="508.2" y2="288.79999999999995" stroke="#668272" stroke-width="1.8"/>
<text x="35" y="330" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Top cleat 1 (TC1)</text>
<text x="35" y="357" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Green strip inside</text>
<text x="35" y="384" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">the left apron</text>
<line x1="273" y1="337" x2="505.48" y2="338.48" stroke="#668272" stroke-width="1.8"/>
<text x="930" y="345" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Top cleat 2 (TC2)</text>
<text x="930" y="372" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Slotted screw holes</text>
<text x="930" y="399" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">allow top movement</text>
<line x1="920" y1="352" x2="711.52" y2="257.52" stroke="#668272" stroke-width="1.8"/>
<text x="35" y="482" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Left apron (A1)</text>
<text x="35" y="509" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Four aprons total:</text>
<text x="35" y="536" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">3/4 x 5 x 12 1/2</text>
<line x1="273" y1="489" x2="535.1875" y2="450.5" stroke="#668272" stroke-width="1.8"/>
<text x="930" y="482" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Front apron (A4)</text>
<text x="930" y="509" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Replaces the drawer</text>
<text x="930" y="536" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">and both front rails</text>
<line x1="920" y1="489" x2="715.8125" y2="426.5" stroke="#668272" stroke-width="1.8"/>
<text x="930" y="635" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Right apron (A2)</text>
<text x="930" y="662" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Behind the front leg</text>
<line x1="920" y1="642" x2="749.6" y2="333.6" stroke="#668272" stroke-width="1.8"/>
<text x="35" y="765" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Four tapered legs</text>
<text x="35" y="792" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">1 1/8 square at top</text>
<text x="35" y="819" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">26 3/4 in long</text>
<line x1="273" y1="772" x2="381.125" y2="729.0" stroke="#668272" stroke-width="1.8"/>
<text x="930" y="845" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263d38" text-anchor="start">Finished height</text>
<text x="930" y="872" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">About 27 1/2 in</text>
<text x="930" y="899" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Base: about 14 x 14</text>
<line x1="920" y1="852" x2="829.5" y2="844.0" stroke="#668272" stroke-width="1.8"/>
<text x="35" y="972" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Taper the two inside faces only;</text>
<text x="35" y="1000" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">keep the outside faces straight.</text>
<text x="35" y="1028" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#263d38" text-anchor="start">Foot: 5/8 in square.</text>
<text x="35" y="1070" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263d38" text-anchor="start">Project adaptation of Schwarz&#x27;s table. Confirm the new front apron joints and top attachment with the instructor.</text>
