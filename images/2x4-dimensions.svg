<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Dimensions of a 2x4x8 board</title>
  <desc id="description">The nominal 2 by 4 name describes only thickness and width. The actual cross-section is about one and one-half inches thick by three and one-half inches wide. The separate eight-foot dimension is the board length.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f3828"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #2d241d; }
      .subtitle { font-size: 24px; fill: #6c5a4c; }
      .label { font-size: 25px; font-weight: 700; fill: #2d241d; }
      .note { font-size: 22px; fill: #6c5a4c; }
      .dimension { stroke: #4f3828; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .extension { stroke: #8b7564; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#f5f0e7"/>
  <text x="600" y="62" text-anchor="middle" class="title">A “2x4x8” board</text>
  <text x="600" y="100" text-anchor="middle" class="subtitle">2 x 4 names the nominal end size; 8 ft is the separate length</text>

  <text x="230" y="155" text-anchor="middle" class="label">End view</text>
  <text x="230" y="184" text-anchor="middle" class="note">actual cross-section</text>
  <rect x="80" y="250" width="300" height="128" rx="4" fill="#bb875c" stroke="#70492d" stroke-width="4"/>
  <path d="M95 278 C160 245 245 320 365 274 M95 332 C175 295 255 365 365 326" fill="none" stroke="#96623f" stroke-width="4" opacity="0.8"/>

  <line x1="80" y1="225" x2="380" y2="225" class="dimension"/>
  <line x1="80" y1="235" x2="80" y2="250" class="extension"/>
  <line x1="380" y1="235" x2="380" y2="250" class="extension"/>
  <text x="230" y="213" text-anchor="middle" class="label">Width ≈ 3 1/2 in</text>

  <line x1="52" y1="250" x2="52" y2="378" class="dimension"/>
  <line x1="62" y1="250" x2="80" y2="250" class="extension"/>
  <line x1="62" y1="378" x2="80" y2="378" class="extension"/>
  <text x="26" y="314" text-anchor="middle" class="label" transform="rotate(-90 26 314)">Thickness ≈ 1 1/2 in</text>

  <text x="800" y="155" text-anchor="middle" class="label">Long view</text>
  <text x="800" y="184" text-anchor="middle" class="note">the same board viewed from its broad face</text>
  <rect x="500" y="250" width="600" height="128" rx="4" fill="#bb875c" stroke="#70492d" stroke-width="4"/>
  <path d="M520 278 C650 245 810 320 1080 274 M520 332 C690 295 860 365 1080 326" fill="none" stroke="#96623f" stroke-width="4" opacity="0.8"/>

  <line x1="500" y1="425" x2="1100" y2="425" class="dimension"/>
  <line x1="500" y1="392" x2="500" y2="415" class="extension"/>
  <line x1="1100" y1="392" x2="1100" y2="415" class="extension"/>
  <text x="800" y="462" text-anchor="middle" class="label">Length = about 8 ft (96 in)</text>

  <rect x="95" y="515" width="1010" height="88" rx="12" fill="#e8ddd0"/>
  <text x="600" y="550" text-anchor="middle" class="label">Typical actual size: 1 1/2 in thick x 3 1/2 in wide x 96 in long</text>
  <text x="600" y="582" text-anchor="middle" class="note">The board has no fixed “height” until you orient it in a project.</text>
</svg>
