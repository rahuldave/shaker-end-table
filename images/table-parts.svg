<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Parts of the Shaker end table and drawer</title>
  <desc id="description">A simplified front view labels the top, legs, apron, upper and lower front rails, drawer front, knob, and feet. An exploded drawer labels its front, sides, back, and bottom.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4f3828"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #2d241d; }
      .title { font-size: 38px; font-weight: 700; }
      .head { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; }
      .note { font-size: 18px; fill: #6c5a4c; }
      .onwood { font-size: 18px; fill: #fff8ee; font-weight: 700; }
      .wood { fill: #c18b5f; stroke: #70492d; stroke-width: 4; }
      .dark { fill: #9d6843; stroke: #70492d; stroke-width: 4; }
      .call { stroke: #4f3828; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f5f0e7"/>
  <text x="600" y="55" text-anchor="middle" class="title">Names of the table and drawer parts</text>
  <text x="325" y="100" text-anchor="middle" class="head">Table front</text>
  <rect x="110" y="135" width="430" height="45" class="dark"/>
  <rect x="150" y="180" width="55" height="455" class="wood"/>
  <rect x="445" y="180" width="55" height="455" class="wood"/>
  <rect x="205" y="185" width="240" height="52" class="dark"/>
  <rect x="205" y="237" width="240" height="175" class="wood"/>
  <circle cx="325" cy="315" r="25" fill="#70492d"/>
  <rect x="205" y="412" width="240" height="45" class="dark"/>
  <path d="M150 635 H205 L198 660 H156 Z" class="dark"/>
  <path d="M445 635 H500 L494 660 H452 Z" class="dark"/>
  <text x="55" y="155" class="label">top</text><path d="M90 150 L130 150" class="call"/>
  <text x="32" y="360" class="label">leg</text><path d="M75 352 L160 352" class="call"/>
  <text x="235" y="220" class="onwood">upper front rail</text>
  <text x="250" y="390" class="onwood">drawer front</text>
  <text x="260" y="445" class="onwood">lower front rail</text>
  <text x="330" y="290" class="onwood">knob</text>
  <text x="505" y="620" class="label">foot</text><path d="M500 614 L478 640" class="call"/>
  <text x="528" y="225" class="label">apron</text>
  <text x="528" y="252" class="note">side/rear frame member</text>
  <path d="M522 235 L445 210" class="call"/>
  <line x1="610" y1="100" x2="610" y2="700" stroke="#d8c9b8" stroke-width="3"/>
  <text x="905" y="100" text-anchor="middle" class="head">Drawer box, exploded</text>
  <polygon points="705,465 980,465 1060,415 785,415" fill="#d6a477" stroke="#70492d" stroke-width="4"/>
  <text x="875" y="500" text-anchor="middle" class="label">bottom</text>
  <rect x="690" y="235" width="300" height="105" class="wood"/>
  <circle cx="840" cy="287" r="22" fill="#70492d"/>
  <text x="840" y="220" text-anchor="middle" class="label">front</text>
  <polygon points="680,365 730,335 730,545 680,575" class="dark"/>
  <polygon points="990,335 1040,365 1040,575 990,545" class="dark"/>
  <text x="655" y="470" text-anchor="middle" class="label">side</text>
  <text x="1065" y="470" text-anchor="middle" class="label">side</text>
  <rect x="760" y="575" width="200" height="75" class="wood"/>
  <text x="860" y="690" text-anchor="middle" class="label">back</text>
  <text x="900" y="380" text-anchor="middle" class="note">groove captures bottom</text>
  <text x="900" y="715" text-anchor="middle" class="note">The article’s simple drawer uses rabbets at its corners.</text>
</svg>
