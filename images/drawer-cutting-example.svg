<rect x="1140.6666666666665" y="81" width="13.333333333333334" height="48" fill="#c8c8c2" stroke="#806447" stroke-width="1.5"/>
<text x="34" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263d38" text-anchor="start">Length 84 in  |  board width 8 in  |  grain runs left to right  &gt;</text>
<text x="34" y="183" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Drawer sides DS1/DS2 and back DB: reserve 4 x 14 each. Remainder 11 3/8 x 8: TEST-P / spare material.</text>
<rect x="34" y="206" width="225" height="36" fill="#e6c7a5" stroke="#806447" stroke-width="1.5"/>
<rect x="34" y="244" width="225" height="36" fill="#e6c7a5" stroke="#806447" stroke-width="1.5"/>
<text x="146" y="231" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38" text-anchor="middle">Bottom 1: 7 1/4 x 14</text>
<text x="146" y="269" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38" text-anchor="middle">Bottom 2: 7 1/4 x 14</text>
<text x="293" y="219" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Joint bottom strips to about 7 in each; glue into a 14 x 14 panel.</text>
<text x="293" y="247" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263d38" text-anchor="start">Grain runs SIDE TO SIDE across the drawer; movement runs front to back.</text>
<text x="293" y="275" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Fit bottom after the drawer joint and groove details are confirmed.</text>
<text x="34" y="311" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Cherry drawer front DF comes from board C2. Keep all drawer blanks oversized until the opening is measured.</text>
</svg>