<text x="34" y="61" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Example surfaced poplar; actual 3/4 x 8 x 84 in. Plane to 1/2; no resawing assumed.</text>
