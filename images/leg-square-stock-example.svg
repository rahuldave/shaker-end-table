<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="leg-square-stock-example.svg">
<rect width="100%" height="100%" fill="#fffdf8"/>
<text x="34" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#263d38" text-anchor="start">SQUARE CHERRY STOCK | TWO STICKS SUPPLY FOUR LEGS</text>
<text x="34" y="59" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Example actual size: 1 1/2 x 1 1/2 x 72 in EACH. Solid cherry; measure before buying.</text>
<rect x="34" y="78" width="15.555555555555555" height="43" fill="#c8c8c2" stroke="#806447" stroke-width="1.5"/>
<rect x="49.55555555555556" y="78" width="451.1111111111111" height="43" fill="#e6c7a5" stroke="#806447" stroke-width="1.5"/>
<text x="275.1111111111111" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38" text-anchor="middle">Leg 1 (L1)</text>
<rect x="500.66666666666663" y="78" width="1.9444444444444444" height="43" fill="#aa4c3c" stroke="#806447" stroke-width="1.5"/>
<rect x="502.6111111111111" y="78" width="451.1111111111111" height="43" fill="#e6c7a5" stroke="#806447" stroke-width="1.5"/>
<text x="728.1666666666666" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38" text-anchor="middle">Leg 2 (L2)</text>
<rect x="953.7222222222222" y="78" width="1.9444444444444444" height="43" fill="#aa4c3c" stroke="#806447" stroke-width="1.5"/>
<rect x="955.6666666666666" y="78" width="182.77777777777777" height="43" fill="#dce7df" stroke="#806447" stroke-width="1.5"/>
<text x="1047.0555555555554" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38" text-anchor="middle">11 3/4 reserve</text>
<rect x="1138.4444444444443" y="78" width="15.555555555555555" height="43" fill="#c8c8c2" stroke="#806447" stroke-width="1.5"/>
<text x="34" y="139" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#263d38" text-anchor="start">Square stick 1: 72 in long; grain runs left to right  &gt;</text>
<rect x="34" y="151" width="15.555555555555555" height="43" fill="#c8c8c2" stroke="#806447" stroke-width="1.5"/>
<rect x="49.55555555555556" y="151" width="451.1111111111111" height="43" fill="#e6c7a5" stroke="#806447" stroke-width="1.5"/>
<text x="275.1111111111111" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38" text-anchor="middle">Leg 3 (L3)</text>
<rect x="500.66666666666663" y="151" width="1.9444444444444444" height="43" fill="#aa4c3c" stroke="#806447" stroke-width="1.5"/>
<rect x="502.6111111111111" y="151" width="451.1111111111111" height="43" fill="#e6c7a5" stroke="#806447" stroke-width="1.5"/>
<text x="728.1666666666666" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38" text-anchor="middle">Leg 4 (L4)</text>
<rect x="953.7222222222222" y="151" width="1.9444444444444444" height="43" fill="#aa4c3c" stroke="#806447" stroke-width="1.5"/>
<rect x="955.6666666666666" y="151" width="182.77777777777777" height="43" fill="#dce7df" stroke="#806447" stroke-width="1.5"/>
<text x="1047.0555555555554" y="179" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38" text-anchor="middle">11 3/4 reserve</text>
<rect x="1138.4444444444443" y="151" width="15.555555555555555" height="43" fill="#c8c8c2" stroke="#806447" stroke-width="1.5"/>
<text x="34" y="212" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#263d38" text-anchor="start">Square stick 2: 72 in long; grain runs left to right  &gt;</text>
<text x="34" y="238" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263d38" text-anchor="start">Per stick: 1-in end reserve + 29 + 1/8 kerf + 29 + 1/8 kerf + 11 3/4 + 1-in end reserve.</text>
<text x="34" y="264" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Mill each leg: rough 1 3/8 x 1 3/8 x 29 -&gt; finished 1 1/8 x 1 1/8 x 26 3/4 in.</text>
<text x="34" y="290" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#263d38" text-anchor="start">Inspect all faces and end grain: straight, clear grain; rings roughly corner to corner.</text>
<text x="34" y="314" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#263d38" text-anchor="start">Square blanks leave little room to rotate the grain. Select suitable grain before buying.</text>
</svg>